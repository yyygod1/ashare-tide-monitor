name: zb-rate-backfill

# 手动触发：补第 6 个因子 zb_rate（炸板率）——用全市场日线近似「最高价触及涨停价但收盘未封住」的占比。
# 为什么放云端：本地 push2 clist 被墙、且本地没有全市场代码清单，云端 runner 能直连东财。
# 设计：默认只校验（拿仓库里近期已有真实 zb_rate 的日子做对照，输出 MAE/Spearman）；
#       校验通过（Spearman>=0.85）才允许 apply=true 写盘。
# 不进每日流程，避免影响日常管道。

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = 校验通过后写入缺口段 zb_rate；false = 只校验（默认）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: zb-rate-backfill
  cancel-in-progress: false

jobs:
  zb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: locate tide-data.json
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          for p in docs/tide-data.json tide-monitor/tide-data.json data/markets/a_share/tide-data.json; do
            if [ -f "$p" ]; then echo "found: $p  $(wc -c < "$p") bytes"; fi
          done

      - name: run zb_rate backfill
        env:
          QD_DIR: ${{ github.workspace }}
        run: |
          set -e
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python tools/qd_zb_rate_backfill.py --apply
          else
            python tools/qd_zb_rate_backfill.py --validate
          fi

      - name: commit if changed
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          set -e
          git config user.name  "zb-backfill-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "no change -> nothing to commit"
            exit 0
          fi
          git add docs/tide-data.json tide-monitor/tide-data.json data/markets/a_share/tide-data.json 2>/dev/null || true
          git commit -m "chore(zb): backfill zb_rate (6/6 factor) $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
