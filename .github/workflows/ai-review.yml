name: ai-review

# 收盘后自动生成 AI 复盘预测并入库（**不依赖本机开机**）
# 触发：工作日 16:05（北京时间，= 08:05 UTC）；也可手动 workflow_dispatch
#
# 需要的仓库 Secret（Settings → Secrets and variables → Actions）：
#   DEEPSEEK_API_KEY  —— 模型 Key（必填）
# 可选（不填则用默认）：
#   AI_BASE_URL       —— 默认 https://api.deepseek.com/v1
#   AI_MODEL          —— 默认 deepseek-chat

on:
  schedule:
    - cron: '5 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成买点节点记忆（review_memory.json）
        env:
          QD_DIR: ${{ github.workspace }}
          TIDE_DATA_PATH: ${{ github.workspace }}/tide-monitor/tide-data.json
          REVIEW_MEMORY_PATH: ${{ github.workspace }}/data/markets/a_share/review_memory.json
          REVIEW_MD_PATH: ${{ github.workspace }}/data/markets/a_share/复盘记忆.md
        run: |
          mkdir -p data/markets/a_share
          python tools/qd_review.py --top 12

      - name: AI 复盘预测（写入台账）
        env:
          QD_DIR: ${{ github.workspace }}
          TIDE_DATA_PATH: ${{ github.workspace }}/tide-monitor/tide-data.json
          REVIEW_MEMORY_PATH: ${{ github.workspace }}/data/markets/a_share/review_memory.json
          REVIEW_LEDGER_PATH: ${{ github.workspace }}/data/markets/a_share/review_ledger.json
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-chat' }}
          AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::未配置仓库 Secret：DEEPSEEK_API_KEY（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          python tools/qd_review_ai.py

      - name: 提交台账（含次日回填与打分）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "ai review $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
