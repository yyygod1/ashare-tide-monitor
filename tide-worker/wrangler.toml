name = "tide-trigger"
main = "worker.js"
compatibility_date = "2025-09-01"

# Cron 全部按 UTC（Cloudflare 强制 UTC）：
#   */5 1-3,5-7 * * 1-5  ->  CST 09:00-11:59 / 13:00-15:59，每 5 分钟（盘中）
#   35 10 * * 1-5         ->  CST 18:35（盘后全量）
[triggers]
crons = ["*/5 1-3,5-7 * * 1-5", "35 10 * * 1-5"]

# GITHUB_TOKEN 用 secret 传（不要写进本文件）：
#   npx wrangler secret put GITHUB_TOKEN

# Cloudflare Dashboard 里直接看日志（免费版：200k 条/日、保留 3 天）
[observability]
enabled = true
